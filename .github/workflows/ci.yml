name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install pytest

      # Everything here is offline: the patch runs against a synthetic
      # lyrics-plus fixture and the provider against a fake endpoint. No
      # spicetify install, no Spotify, no network.
      - run: make test
